timeframes: [5, 10, 15]
checkpoints: [premarket, open+5, open+10, open+15]
gates: [open, open+10]          # entry gates actually run (compute multiplies per gate)
session: {open: "09:30", close: "16:00", eod_cutoff: "15:55", tz: America/New_York}   # flat at the open of the last bar (eod_cutoff documents 5m bars)
max_entries_per_day: 2
min_sample: 20                  # min trades before a variant/regime estimate is trusted
min_history_days: 120           # symbols with less are excluded from learning
# commission per share + slippage per side in bps of price (converted to ticks at the median price, min 1), by liquidity tier
costs:
  mega:    {commission_per_share: 0.005, slippage_bps: 1}
  large:   {commission_per_share: 0.005, slippage_bps: 2}
  volatile: {commission_per_share: 0.005, slippage_bps: 5}
tiers:
  mega: [AAPL, MSFT, NVDA, AMZN, GOOG, META, TSLA, QQQ, AVGO, AMD, ORCL, TSM]
  volatile: [QBTS, IONQ, SOUN, INFQ, SPCX, SKHY, PSQL, GRRR, WULF, APLD, IREN, NVTS, INOD, FROG, FIG, CRWV, NBIS, ALAB]
  default: large
paths: {cache: data/cache, catalog: data/catalog.json, db: data/store.duckdb, runs: runs}
data: {interval: 1min, extended_hours: true, outputsize: 5000}
adapter: {notional: 10000, initial_capital: 1000000, warmup_days: 30}   # fixed $ per entry so strategies compare on one scale
